<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next Session — Slappybag's Toolbag</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4ecdc;--card:#fffaf0;--ink:#2b2118;--muted:#7a6a58;--line:#d9c9a8;--accent:#7a1f1f;--gold:#b8862b;--ok:#4f7a3a;--steel:#8a8f98;--hl:#f3e0a8}
@media (prefers-color-scheme:dark){:root{--bg:#1c1814;--card:#28211b;--ink:#efe4d0;--muted:#a8977f;--line:#45392c;--accent:#d06a5a;--gold:#d9a84a;--ok:#8fbf6f;--steel:#c4c9d2;--hl:#5a4620}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
h1,h2,h3{font-family:Cinzel,serif;margin:0}
.muted{color:var(--muted);font-size:.85rem}
.app{display:flex;min-height:calc(100vh - 62px)}
main{flex:1;min-width:0;padding:4px 14px 40px}

/* ---------- left rail ---------- */
.rail{width:200px;flex-shrink:0;border-right:1px solid var(--line);background:var(--card);padding:12px 8px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}
.row{display:flex;align-items:center;gap:8px;padding:9px 6px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.row:hover{background:var(--bg)}
.row.active{background:var(--bg);border-color:var(--gold)}
.chk{width:24px;height:24px;border-radius:5px;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:#fff;flex-shrink:0;cursor:pointer;background:var(--card)}
.row.done .chk{background:var(--ok);border-color:var(--ok)}
.row.done .nm{text-decoration:line-through;color:var(--muted)}
.row .nm{flex:1;font-weight:600}
.cnt{font-size:.8rem;color:var(--muted);white-space:nowrap}
.railsep{border-top:1px solid var(--line);margin:8px 4px}

/* ---------- full-width banner + drop-down ---------- */
.ns{position:sticky;top:0;z-index:15;height:62px}
.nsbar{position:relative;z-index:2;width:100%;height:62px;display:flex;align-items:center;gap:12px;background:var(--card);border:none;border-bottom:2px solid var(--gold);padding:0 16px;text-align:left;
 box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .18s ease,background .18s,box-shadow .18s}
.nsbar:hover{background:color-mix(in srgb,var(--card) 82%,#000);transform:translateY(3px);box-shadow:0 6px 14px rgba(0,0,0,.18)}
.logo{font-family:Cinzel,serif;font-weight:700;font-size:1.45rem;color:var(--accent);margin:0;display:flex;align-items:center;white-space:nowrap;letter-spacing:.5px}
.sessname{flex:1;min-width:0;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swords{width:1.15em;height:1.15em;margin:0 -.02em;overflow:visible;transform:translateY(.02em)}
.swords .s{stroke:color-mix(in srgb,var(--steel) 60%,#000);stroke-width:.6}
.pill{font-size:.85rem;font-weight:700;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:2px 10px;white-space:nowrap}
.pill.all{background:var(--ok);border-color:var(--ok);color:#fff}
.chev{color:var(--muted);transition:transform .25s}
.home{display:block;margin:14px 6px 0;padding-top:12px;border-top:1px solid var(--line);color:var(--accent);font-weight:600;font-size:.85rem;text-decoration:none}
.home:hover{text-decoration:underline}
.ns.open .chev{transform:rotate(180deg)}
.swords .s{fill:var(--steel)} .swords .h{fill:var(--gold)}
.swords .sl,.swords .sr,.swords .spark{transform-box:view-box;transform-origin:20px 20px}
.swords .spark{opacity:0}
.duel .sl{animation:duelL .75s ease-in-out}
.duel .sr{animation:duelR .75s ease-in-out}
.duel .spark{animation:spark .75s ease-out}
@keyframes duelL{0%{transform:none}35%{transform:translate(-8px,2px) rotate(-18deg)}58%{transform:translate(1.5px,0) rotate(3deg)}70%,100%{transform:none}}
@keyframes duelR{0%{transform:none}35%{transform:translate(8px,2px) rotate(18deg)}58%{transform:translate(-1.5px,0) rotate(-3deg)}70%,100%{transform:none}}
@keyframes spark{0%,52%{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(.6)}}
.nspanel{position:fixed;left:0;right:0;top:62px;bottom:0;z-index:1;background:var(--bg);overflow:auto;padding:16px;
 transform:translateY(-100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.ns.open .nspanel{transform:none;visibility:visible}
.pin{max-width:860px;margin:0 auto}
.icons{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px}
.ti{flex:0 0 auto;width:84px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px 8px;text-align:center;position:relative}
.ti:hover{border-color:var(--gold)}
.ti .e{font-size:1.9rem;line-height:1}
.ti .l{font-size:.72rem;font-weight:700;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti .n{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:#fff;font-size:.75rem;font-weight:700;display:grid;place-items:center;padding:0 5px}
.ti .n.z{background:var(--line);color:var(--muted)}
.ti.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.ti.done .l::before{content:"✓ ";color:var(--ok)}
.notes{display:block;width:100%;min-height:22vh;margin-top:6px;font:inherit;font-size:1rem;line-height:1.45;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;resize:vertical}
.pactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px}
.box h3{font-size:1rem;color:var(--accent);margin-bottom:8px}
.sessrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sessrow select{font:inherit;padding:7px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:220px;flex:1}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px;margin:6px 0 10px}
.parts label{display:flex;gap:8px;align-items:center;font-size:.95rem}
.parts .c{color:var(--muted);font-size:.8rem;margin-left:auto}
.prog{font-size:.9rem;color:var(--muted);min-height:1.2em}
/* the print docket (pull-down) */
.dkt{margin-top:0}
.dkt .dh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dkt .dh h3{flex:1;margin:0}
.dgrp{border-top:1px solid var(--line);padding:8px 0}
.dgrp:first-of-type{border-top:none}
.dgh{display:flex;align-items:center;gap:8px;font-weight:700}
.dgh .c{color:var(--muted);font-weight:400;font-size:.85rem}
.dgh .sp{flex:1}
.dgh a,.dgh button.lnk{font-size:.8rem;font-weight:600;color:var(--accent);background:none;border:none;padding:0;text-decoration:underline}
.dgrp.off .dits{opacity:.4}
.dits{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0 26px}
.dit{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:2px 4px 2px 2px;font-size:.85rem;max-width:100%}
.dit .th{width:24px;height:24px;border-radius:50%;background:var(--card) center/cover no-repeat;display:grid;place-items:center;font-size:.8rem;flex-shrink:0}
.dit .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;cursor:pointer}
.dit .nm small{color:var(--muted)}
.dit button{width:22px;height:22px;border-radius:50%;border:none;background:transparent;color:var(--muted);padding:0;line-height:1}
.dit button:hover{background:var(--line);color:var(--ink)}
.dit.miss{opacity:.55;font-style:italic}
.dnote{margin:6px 0 0 26px;font-size:.85rem;color:var(--muted)}
.dempty{color:var(--muted);font-size:.9rem;padding:6px 0}
.pv{margin-top:10px;display:none}
.pv.on{display:block}
.pv iframe{width:100%;height:78vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.pv .pvbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.pv .pvbar .sp{flex:1}
.pv .nopv{background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:16px;text-align:center}
.icons.small .ti{width:70px;padding:6px 2px 5px}.icons.small .ti .e{font-size:1.4rem}
/* docket toggle on each library tile */
.card .dk{position:absolute;top:6px;left:6px;z-index:2;min-width:30px;height:30px;border-radius:15px;border:2px solid var(--card);background:var(--accent);color:#fff;font-weight:700;font-size:1rem;display:grid;place-items:center;padding:0 8px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.card .dk.on{background:var(--ok)}
.card .dk:hover{filter:brightness(1.12)}
.card .tg{position:absolute;bottom:6px;right:6px;font-size:.68rem;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:0 6px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-2px 0 12px}
.filters select{font:inherit;font-size:.9rem;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
.chipz{display:flex;gap:6px;flex-wrap:wrap}
.chipz button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:4px 10px;font-size:.85rem;font-weight:600}
.chipz button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.filters label{display:flex;gap:6px;align-items:center;font-size:.9rem}

/* ---------- tab library ---------- */
.libhead{display:flex;align-items:center;gap:10px;margin:16px 0 10px;flex-wrap:wrap}
.libhead h2{font-size:1.2rem;color:var(--accent);flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.sub-h{font-family:Cinzel,serif;font-size:.85rem;color:var(--muted);margin:18px 0 8px;grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;text-align:left;padding:0}
.card:hover{border-color:var(--gold)}
.card.in{outline:3px solid var(--ok);outline-offset:-1px}
.pic{aspect-ratio:4/3;background:var(--bg) center/contain no-repeat;display:grid;place-items:center;font-size:2.2rem}
.card .b{padding:8px 9px}
.card .t{font-weight:700;font-size:.95rem}
.card .s{font-size:.78rem;color:var(--gold);font-weight:600}
.card .i{font-size:.8rem;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{position:absolute;top:6px;right:6px;z-index:2;background:var(--ok);color:#fff;font-size:.7rem;font-weight:700;border-radius:10px;padding:1px 7px}
.badge.l{left:6px;right:auto;background:var(--steel)}
.addcard{border:2px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);min-height:150px;font-weight:700;display:grid;place-items:center;text-align:center;text-decoration:none;padding:8px}
.addcard small{display:block;font-weight:400;font-size:.75rem}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;padding:8px 12px;font-weight:600;text-decoration:none;display:inline-block}
.btn.g{background:transparent;color:var(--accent)}
.btn.s{padding:5px 9px;font-size:.85rem}
.btn:disabled{opacity:.5}
.search{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);min-width:180px}

/* ---------- booklet ---------- */
.bk{max-width:860px}
.bk .fld textarea{min-height:120px}
.scene{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}
.scene .sh{display:flex;gap:6px;align-items:center}
.scene .sh input{flex:1;font:inherit;font-weight:700;font-size:1.05rem;border:1px solid transparent;background:transparent;color:var(--ink);padding:6px;border-radius:6px}
.scene .sh input:focus{border-color:var(--line);background:var(--bg)}
.scene .sh .n{font-family:Cinzel,serif;color:var(--accent);font-weight:700}
.scene textarea{display:block;width:100%;min-height:130px;font:inherit;line-height:1.45;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px;resize:vertical;margin-top:6px}
.ib{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--card);padding:0}
.prev{margin-top:8px;font-size:.95rem;line-height:1.45}
.prev p{margin:.25em 0}
.prev .beat{border-left:4px solid var(--gold);padding:3px 8px;background:color-mix(in srgb,var(--gold) 12%,transparent);font-weight:700;border-radius:0 6px 6px 0}
.prev .beat::before{content:"BEAT  ";font-size:.7rem;letter-spacing:1px;color:var(--gold)}
.prev .ck{background:var(--hl);border-radius:4px;padding:0 4px;font-weight:700}
.prev .mn{font-weight:700;color:var(--accent)}
.prev h4{font-family:Cinzel,serif;color:var(--accent);margin:.6em 0 .2em}
.prev ul{margin:.2em 0 .2em 1.2em;padding:0}
.tip{font-size:.85rem;color:var(--muted);margin:4px 0 0}

/* ---------- sheet + detail page ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(420px,100vw);background:var(--card);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:14px;z-index:21;transition:transform .22s;max-height:90vh;overflow:auto}
.sheet.on{transform:translate(-50%,0)}
.sheet:not(.on){visibility:hidden;transition:transform .22s,visibility 0s .22s}
.sheet .btn{width:100%;margin-top:8px;padding:11px;text-align:center}
.page{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;display:none}
.page.on{display:block}
.pw{max-width:760px;margin:0 auto;padding:16px}
.hero{aspect-ratio:16/9;max-height:320px;width:100%;border-radius:12px;background:var(--card) center/contain no-repeat;border:1px solid var(--line);display:grid;place-items:center;font-size:4rem;position:relative}
.hero label{position:absolute;bottom:8px;right:8px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:.8rem;cursor:pointer}
.fld{display:block;margin-top:12px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.fld input,.fld textarea,.fld select{display:block;width:100%;margin-top:4px;font:inherit;font-size:1rem;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:9px}
.fld textarea{min-height:70px;resize:vertical}
.fld textarea.big{min-height:240px}
.fld textarea.mono{font-family:ui-monospace,Consolas,monospace;font-size:.85rem;min-height:300px}
.opt{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:.95rem}
.top{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.top .sp{flex:1}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.stats span{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:.85rem}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:40;max-width:90vw;text-align:center}
.toast.show{opacity:1}

@media (max-width:700px){
 .rail{width:104px;padding:8px 5px}
 .row{flex-wrap:wrap;gap:4px;padding:7px 4px}
 .row .nm{font-size:.8rem;flex-basis:100%;order:2}
 .row .cnt{margin-left:auto;font-weight:700}
 main{padding:4px 10px 40px}
 .logo{font-size:1.15rem}
 .sessname{display:none}
 .pill .ck{display:none}
 .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
}
</style>
</head>
<body>
<div class="ns" id="ns">
 <button class="nsbar" id="nsbar" aria-expanded="false" aria-label="Next Session">
  <h1 class="logo">Ne<svg class="swords" id="swords" viewBox="0 0 40 40" aria-hidden="true">
   <g class="sl"><g transform="translate(20 20) rotate(45)"><polygon class="s" points="0,-17 2.4,-13 2.4,6 -2.4,6 -2.4,-13"/><rect class="h" x="-7" y="6" width="14" height="3" rx="1"/><rect class="h" x="-1.5" y="9" width="3" height="6"/><circle class="h" cx="0" cy="16.2" r="2.2"/></g></g>
   <g class="sr"><g transform="translate(20 20) rotate(-45)"><polygon class="s" points="0,-17 2.4,-13 2.4,6 -2.4,6 -2.4,-13"/><rect class="h" x="-7" y="6" width="14" height="3" rx="1"/><rect class="h" x="-1.5" y="9" width="3" height="6"/><circle class="h" cx="0" cy="16.2" r="2.2"/></g></g>
   <g class="spark"><polygon points="20,8 21.6,12.4 26,11 22.8,14.4 27,17 21.8,16.4 20,21 18.2,16.4 13,17 17.2,14.4 14,11 18.4,12.4" fill="#ffd34d" stroke="#ff8a1f" stroke-width=".6"/></g>
  </svg>t Session</h1>
  <span class="sessname" id="sessname"></span>
  <span class="pill" id="nspill">0/0</span>
  <span class="chev">▾</span>
 </button>
 <div class="nspanel" id="nspanel"><div class="pin">
  <div class="box dkt">
   <div class="dh"><h3>🖨️ Print docket</h3><span class="muted" id="dksum"></span></div>
   <div id="docket"></div>
   <div class="pactions">
    <button class="btn" id="pvbtn">👁 Print preview</button>
    <button class="btn g" id="pdf">⬇ Save PDF</button>
    <span class="prog" id="prog"></span>
   </div>
   <div class="pv" id="pv"></div>
  </div>
  <div class="box">
   <h3>Session</h3>
   <div class="sessrow">
    <select id="sesspick" aria-label="Saved sessions"></select>
    <button class="btn s" id="sessnew" title="Start the next session: the attending PCs carry over, everything else starts empty">＋ Next session</button>
    <button class="btn g s" id="sessdup" title="Copy this session, picks and plan included">Duplicate</button>
    <button class="btn g s" id="sessdel">Delete</button>
   </div>
   <div class="sessrow" style="margin-top:8px">
    <button class="btn g s" id="backup" title="Download every session, quick card, detail page and stat block as a file">⬇ Back up sessions</button>
    <label class="btn g s" title="Load sessions from a backup file">⬆ Restore<input type="file" accept=".json,application/json" id="restore" hidden></label>
    <span class="muted">Sessions are saved on this device as you go. Library cards stay in their own tools.</span>
   </div>
  </div>
  <div class="icons small" id="nsicons" style="margin-top:12px"></div>
  <label class="fld" for="nsnotes">Notes for next session</label>
  <textarea class="notes" id="nsnotes" placeholder="Reminders, secrets & clues, loose ends…"></textarea>
 </div></div>
</div>
<div class="app">
 <aside class="rail"><div id="rail"></div><a class="home" href="index.html">← Back to the Toolbag</a></aside>
 <main><div id="lib"></div></main>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
 <div style="display:flex;gap:10px;align-items:center"><div class="pic" id="spic" style="width:54px;aspect-ratio:1;border-radius:8px;font-size:1.4rem"></div><div><div id="stitle" style="font-weight:700"></div><div class="muted" id="ssub"></div></div></div>
 <button class="btn" id="sinc"></button><div id="sassign"></div>
 <button class="btn g" id="sopen">Open details page</button>
 <a class="btn g" id="stool" target="_blank" rel="noopener">Edit in its card tool ↗</a>
 <button class="btn g" id="scancel" style="border-color:transparent">Cancel</button>
</div>
<div class="page" id="page"><div class="pw">
 <div class="top"><button class="btn g" id="pback">← Back</button><span class="sp"></span><a class="btn g" id="ptool" target="_blank" rel="noopener">Edit card ↗</a><button class="btn" id="pinc"></button></div>
 <div class="hero" id="phero"><label id="pfilel">📷 Picture<input type="file" accept="image/*" id="pfile" hidden></label></div>
 <div id="passign"></div>
 <div id="pown">
  <label class="fld">Name<input id="pname"></label>
  <label class="fld">Subtitle (role, level, type…)<input id="psub"></label>
  <label class="fld">Card info (short, shows on card)<textarea id="pinfo"></textarea></label>
 </div>
 <div id="plib"><h2 id="plname" style="margin-top:14px"></h2><div class="muted" id="plsub"></div><div class="stats" id="plstats"></div></div>
 <label class="fld">Details page<textarea class="big" id="pdet" placeholder="Background, motives, tactics, what they know, how they react, links, session notes…"></textarea></label>

 <div id="pblockw">

<script src="toolbag-core.js"></script>
<script>
(function(){
"use strict";
/* ============================================================================================
   Next Session. Sessions live in IndexedDB (TB.store "ns-v3"); the card libraries are the tools'
   own (read straight from their TB.store keys), so a card made in Item Cards shows up here.
   S = {cur, sessions:[session], own:[quick card], extra:{ref:{det, block}}}
   session = {id, title, date, recap, intro, scenes:[{id,title,text}], notes, checked:{tab:true},
              picks:{tab:[{ref, pc, det, block}]}}
   A ref is "<lib>:<id>": item / feat / spell / creature / hazard for library cards, own for quick cards.
   ============================================================================================ */
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
var uid = function(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); };

/* The tools: their library key, page, the kind TBExport reports, and what a tab pulls from. */
var TOOLS = {
  item:     {key:"pf2e-item-lib",   page:"item-cards.html",       name:"Item Cards"},
  feat:     {key:"pf2e-feat-lib",   page:"feat-cards.html",       name:"Feat Cards"},
  spell:    {key:"pf2e-spell-lib",  page:"spell-cards.html",      name:"Spell Cards"},
  creature: {key:"pf2e-init-lib",   page:"initiative-cards.html", name:"Initiative Cards"},
  hazard:   {key:"pf2e-hazard-lib", page:"hazard-cards.html",     name:"Hazard Cards"}
};
/* [tab, label, icon, library it pulls from (or null), word for one] */
var TABS = [
  ["booklet","Booklet","📖",null,""],
  ["library","All libraries","🔎",null,"card"],
  ["pcs","PCs","🛡️",null,"PC"],
  ["npcs","NPCs","🧙","creature","NPC"],
  ["creatures","Creatures","🐉","creature","creature"],
  ["hazards","Hazards","🪤","hazard","hazard"],
  ["items","Items & Loot","💰","item","item"],
  ["spells","Spells","✨","spell","spell"],
  ["feats","Feats","📘","feat","feat"],
  ["locations","Locations","🗺️",null,"location"]
];
var CARD_TABS = TABS.filter(function(t){ return t[0] !== "booklet" && t[0] !== "library"; });
/* where a card goes when it's added from All libraries */
var HOME = {item:"items", feat:"feats", spell:"spells", hazard:"hazards", creature:"creatures"};
function homeTab(c){
  if(c.lib === "own") return c.raw.cat;
  if(c.lib === "creature" && pickOf("npcs", c.ref)) return "npcs";
  return HOME[c.lib];
}
function inDocket(c){ return CARD_TABS.some(function(t){ return pickOf(t[0], c.ref); }); }
var tab = function(k){ return TABS.filter(function(t){ return t[0] === k; })[0]; };

var KEY = "ns-v3", OLD = "pf2-prep-cards-v2";
var S = null, LIB = {item:[], feat:[], spell:[], creature:[], hazard:[]};
var ui = {tab:"booklet", q:"", f:{}};
function filt(){ return ui.f[ui.tab] = ui.f[ui.tab] || {trait:"", lvl:"", sort:"name", only:false, types:[]}; }
try{ ui.tab = localStorage.getItem("ns-tab") || "booklet"; }catch(e){}
if(!tab(ui.tab)) ui.tab = "booklet";

function newSession(n){
  return {id:uid(), title:"Session " + n, date:"", recap:"", intro:"", scenes:[{id:uid(), title:"Opening", text:""}],
          notes:"", checked:{}, picks:{}};
}
function cur(){ return S.sessions.filter(function(s){ return s.id === S.cur; })[0] || S.sessions[0]; }
function picks(k){ var s = cur(); return s.picks[k] = s.picks[k] || []; }
function pickOf(k, ref){ return picks(k).filter(function(p){ return p.ref === ref; })[0]; }

var saveSoon = TB.debounce(function(){ TB.store.set(KEY, S).catch(function(){ toast("Couldn't save — storage is full (large pictures on quick cards?)", 4000); }); }, 300);
TB.onLeave(saveSoon.flush);
var save = function(){ ver++; saveSoon(); var st = $("pvstale"); if(st && $("pv").classList.contains("on")) st.textContent = "· the docket changed — press Print preview again to update"; };

/* The old one-session page kept its cards in localStorage; they become quick cards and Session 1. */
function migrate(){
  var old = null; try{ old = JSON.parse(localStorage.getItem(OLD)); }catch(e){}
  var s = newSession(1);
  var st = {cur:s.id, sessions:[s], own:[], extra:{}};
  if(old && Array.isArray(old.cards)){
    old.cards.forEach(function(c){
      var oc = {id:c.id || uid(), cat:c.cat || "locations", name:c.name || "", sub:c.sub || "", info:c.info || "", img:c.img || "", iw:c.iw, ih:c.ih};
      st.own.push(oc);
      if(c.det) st.extra["own:" + oc.id] = {det:c.det};
      if(c.in){ (s.picks[oc.cat] = s.picks[oc.cat] || []).push({ref:"own:" + oc.id, pc:c.pc ? "own:" + c.pc : "", det:!!c.det}); }
    });
    s.notes = old.notes || ""; s.checked = old.checked || {};
  }
  return st;
}

/* ---------------- library cards, as this page shows them ---------------- */
function libCard(lib, c){
  var t = [], sub = "", info = "";
  var tr = (c.traits || []).join(", ");
  if(lib === "item"){ sub = [c.cat, (c.value || "").trim() ? "Item " + c.value.trim() : ""].filter(Boolean).join(" · "); info = tr; }
  else if(lib === "feat"){ sub = [c.cat, (c.level || "").trim() ? "Feat " + c.level.trim() : ""].filter(Boolean).join(" · "); info = tr; }
  else if(lib === "spell"){ var w = /^(Cantrip|Focus|Ritual)$/.test(c.cat || "") ? c.cat : "Spell"; sub = (c.level || "").trim() ? w + " " + c.level.trim() : w; info = [c.trad, tr].filter(Boolean).join(" · "); }
  else if(lib === "creature"){
    var lv = /\bCreature\s+(-?\d+)/i.exec(c.block || "");
    sub = [lv ? "Creature " + lv[1] : "", c.ac ? "AC " + c.ac : "", c.hp ? "HP " + c.hp : ""].filter(Boolean).join(" · ");
    info = tr;
  }
  else if(lib === "hazard"){ sub = c.kicker || ""; info = [c.stealthDc ? "Stealth " + c.stealthDc : "", c.disableDc ? "Disable " + c.disableDc : ""].filter(Boolean).join(" · "); }
  var lvm = lib === "item" ? /-?\d+/.exec(c.value || "") : lib === "feat" || lib === "spell" ? /-?\d+/.exec(c.level || "") :
    lib === "creature" ? /\bCreature\s+(-?\d+)/i.exec(c.block || "") : /\bHazard\s+(-?\d+)/i.exec(c.kicker || c.block || "");
  return {ref:lib + ":" + c.id, lib:lib, id:c.id, name:c.name || "Untitled", sub:sub, info:info,
          lvl:lvm ? +(lvm[1] || lvm[0]) : null, traits:(c.traits || []).map(function(t){ return typeof t === "string" ? t : (t && (t.name || t.n)) || ""; }).filter(Boolean),
          img:c.image || c.imageUrl || "", source:c.source || "", block:c.block || "", raw:c};
}
function ownCard(c){ var m = /-?\d+/.exec(c.sub || ""); return {ref:"own:" + c.id, lib:"own", id:c.id, name:c.name || "Untitled", sub:c.sub || "", info:c.info || "", img:c.img || "", raw:c, lvl:m ? +m[0] : null, traits:[]}; }
function byRef(ref){
  var i = ref.indexOf(":"), lib = ref.slice(0, i), id = ref.slice(i + 1);
  if(lib === "own"){ var o = S.own.filter(function(c){ return c.id === id; })[0]; return o ? ownCard(o) : null; }
  var c = (LIB[lib] || []).filter(function(c){ return c.id === id; })[0];
  return c ? libCard(lib, c) : null;
}
function cardsFor(k){
  if(k === "library"){
    var all = [];
    Object.keys(TOOLS).forEach(function(l){ all = all.concat((LIB[l] || []).map(function(c){ return libCard(l, c); })); });
    return all.concat(S.own.map(ownCard));
  }
  var t = tab(k), out = [];
  if(t[3]) out = (LIB[t[3]] || []).map(function(c){ return libCard(t[3], c); });
  return out.concat(S.own.filter(function(c){ return c.cat === k; }).map(ownCard));
}
function loadLibs(){
  return Promise.all(Object.keys(TOOLS).map(function(k){
    return TB.store.get(TOOLS[k].key).then(function(v){ LIB[k] = Array.isArray(v) ? v : []; }, function(){ LIB[k] = []; });
  }));
}
function extra(ref){ return S.extra[ref] = S.extra[ref] || {}; }
function pcName(ref){ var c = ref && byRef(ref); return c ? c.name : ""; }
function inCount(k){ return picks(k).filter(function(p){ return byRef(p.ref); }).length; }

/* ---------------- toast ---------------- */
function toast(t, ms){ var e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(e._t); e._t = setTimeout(function(){ e.classList.remove("show"); }, ms || 2200); }

/* ---------------- highlighting (screen and PDF share the rules) ----------------
   A beat is a line that starts with "!". A check is "DC 20 Athletics", "Athletics DC 20",
   "DC 18 basic Will save", "Recall Knowledge DC 22" and the like. Names of cards picked for the
   session are picked out too. */
var SKILLW = "Acrobatics|Arcana|Athletics|Crafting|Deception|Diplomacy|Intimidation|Medicine|Nature|Occultism|Performance|Religion|Society|Stealth|Survival|Thievery|Perception|Fortitude|Reflex|Will|Recall Knowledge|Lore|[A-Z][a-z]+ Lore|Flat";
var CHECK = new RegExp("\\b(?:DC\\s*\\d+\\s+(?:basic\\s+)?(?:" + SKILLW + ")(?:\\s+(?:save|check))?|(?:" + SKILLW + ")(?:\\s+(?:save|check))?(?:\\s*\\(DC\\s*\\d+\\)|,?\\s*DC\\s*\\d+))", "g");
function mentionRe(){
  var names = [];
  CARD_TABS.forEach(function(t){ picks(t[0]).forEach(function(p){ var c = byRef(p.ref); if(c && c.name.length > 2) names.push(c.name); }); });
  names.sort(function(a, b){ return b.length - a.length; });
  return names.length ? new RegExp("\\b(" + names.map(function(n){ return n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|") + ")\\b", "g") : null;
}
/* A line as runs: [{t, b, i, ck, mn}] — **bold**, *italic*, checks, mentions. */
function lineRuns(line, mre){
  var runs = [];
  String(line).split(/(\*\*[^*]+\*\*|\*[^*\s][^*]*\*)/).forEach(function(part){
    if(!part) return;
    var b = /^\*\*.*\*\*$/.test(part), it = !b && /^\*.*\*$/.test(part);
    var txt = b ? part.slice(2, -2) : it ? part.slice(1, -1) : part;
    var marks = [];
    txt.replace(CHECK, function(m, off){ marks.push([off, off + m.length, "ck"]); return m; });
    if(mre) txt.replace(mre, function(m, g, off){ if(!marks.some(function(k){ return off < k[1] && off + m.length > k[0]; })) marks.push([off, off + m.length, "mn"]); return m; });
    marks.sort(function(a, b2){ return a[0] - b2[0]; });
    var at = 0;
    marks.forEach(function(k){
      if(k[0] > at) runs.push({t:txt.slice(at, k[0]), b:b, i:it});
      runs.push({t:txt.slice(k[0], k[1]), b:true, i:it, ck:k[2] === "ck", mn:k[2] === "mn"});
      at = k[1];
    });
    if(at < txt.length) runs.push({t:txt.slice(at), b:b, i:it});
  });
  return runs;
}
/* Text as blocks: {kind:"h"|"li"|"beat"|"p"|"gap", runs} */
function blocks(text, mre){
  var out = [];
  String(text || "").replace(/\r/g, "").split("\n").forEach(function(l){
    var s = l.trim();
    if(!s){ out.push({kind:"gap"}); return; }
    var h = /^#{1,3}\s+(.*)$/.exec(s); if(h){ out.push({kind:"h", runs:lineRuns(h[1], mre)}); return; }
    var bt = /^!\s*(.*)$/.exec(s); if(bt){ out.push({kind:"beat", runs:lineRuns(bt[1], mre)}); return; }
    var li = /^[-*•]\s+(.*)$/.exec(s); if(li){ out.push({kind:"li", runs:lineRuns(li[1], mre)}); return; }
    out.push({kind:"p", runs:lineRuns(s, mre)});
  });
  return out;
}
function runsHtml(runs){
  return runs.map(function(r){
    var t = esc(r.t);
    if(r.ck) return '<span class="ck">' + t + '</span>';
    if(r.mn) return '<span class="mn">' + t + '</span>';
    if(r.b) t = "<b>" + t + "</b>"; if(r.i) t = "<i>" + t + "</i>";
    return t;
  }).join("");
}
function previewHtml(text){
  var mre = mentionRe(), html = "", inList = false;
  blocks(text, mre).forEach(function(b){
    if(b.kind !== "li" && inList){ html += "</ul>"; inList = false; }
    if(b.kind === "gap") return;
    if(b.kind === "li"){ if(!inList){ html += "<ul>"; inList = true; } html += "<li>" + runsHtml(b.runs) + "</li>"; return; }
    if(b.kind === "h"){ html += "<h4>" + runsHtml(b.runs) + "</h4>"; return; }
    html += '<p' + (b.kind === "beat" ? ' class="beat"' : '') + '>' + runsHtml(b.runs) + '</p>';
  });
  if(inList) html += "</ul>";
  return html;
}

/* ---------------- render ---------------- */
function render(){
  var s = cur();
  $("sessname").textContent = "· " + (s.title || "Untitled") + (s.date ? " · " + s.date : "");
  var rail = "", done = 0;
  TABS.forEach(function(t){
    var k = t[0], ok = !!s.checked[k]; if(ok) done++;
    rail += (k === "pcs" ? '<div class="railsep"></div>' : '') +
      '<div class="row ' + (ok ? 'done ' : '') + (ui.tab === k ? 'active' : '') + '" data-tab="' + k + '">' +
      '<span class="chk" data-k="' + k + '" title="Mark this tab done">' + (ok ? '✓' : '') + '</span><span class="nm">' + t[2] + ' ' + t[1] + '</span>' +
      '<span class="cnt" title="' + (k === "booklet" ? "scenes in the plan" : k === "library" ? "cards in all your libraries" : "in the print docket") + '">' + (k === "booklet" ? (s.scenes || []).length : k === "library" ? cardsFor("library").length : inCount(k)) + '</span></div>';
  });
  $("rail").innerHTML = rail;
  var nd = docketCount();
  var pill = $("nspill"); pill.innerHTML = "🖨️ " + nd + '<span class="ck"> in the docket · ' + done + "/" + TABS.length + ' tabs checked</span>'; pill.classList.toggle("all", done === TABS.length);
  $("nsicons").innerHTML = TABS.filter(function(t){ return t[0] !== "library"; }).map(function(t){
    var c = t[0] === "booklet" ? (s.scenes || []).length : inCount(t[0]);
    return '<button class="ti ' + (s.checked[t[0]] ? 'done' : '') + '" data-tab="' + t[0] + '" title="' + t[1] + '"><span class="n ' + (c ? '' : 'z') + '">' + c + '</span><div class="e">' + t[2] + '</div><div class="l">' + t[1] + '</div></button>';
  }).join("");
  if(document.activeElement !== $("nsnotes")) $("nsnotes").value = s.notes || "";
  renderSessions(); renderDocket();
  if(ui.tab === "booklet") renderBooklet(); else renderTab();
}
function renderSessions(){
  $("sesspick").innerHTML = S.sessions.map(function(x){
    return '<option value="' + x.id + '"' + (x.id === S.cur ? " selected" : "") + '>' + esc((x.title || "Untitled") + (x.date ? " — " + x.date : "")) + '</option>';
  }).join("");
}
function cardTile(c, k){
  var lib = k === "library", hk = lib ? homeTab(c) : k;
  var p = pickOf(hk, c.ref), on = lib ? inDocket(c) : !!p, pc = p && p.pc ? pcName(p.pc) : "";
  var flags = [p && p.block ? "stat block" : "", p && p.det ? "details" : ""].filter(Boolean).join(" + ");
  var tl = tab(hk) || tab("library");
  return '<div class="card ' + (on ? 'in' : '') + '" data-ref="' + esc(c.ref) + '" role="button" tabindex="0">' +
    '<button class="dk' + (on ? ' on' : '') + '" data-dk="' + esc(c.ref) + '" title="' + (on ? "Take it out of the print docket" : "Add to the print docket") + '">' + (on ? "✓" : "＋") + '</button>' +
    (on && hk === "pcs" ? '<span class="badge">Attending</span>' : '') +
    '<div class="pic" style="' + (c.img ? 'background-image:url(' + esc(c.img) + ')' : '') + '">' + (c.img ? '' : tl[2]) + '</div>' +
    (lib ? '<span class="tg">' + esc(tl[1]) + '</span>' : '') +
    '<div class="b"><div class="t">' + esc(c.name) + '</div>' + (c.sub ? '<div class="s">' + esc(c.sub) + '</div>' : '') +
    '<div class="i">' + esc(c.info) + '</div>' +
    (pc ? '<div class="s" style="margin-top:4px">→ ' + esc(pc) + '</div>' : '') +
    (flags ? '<div class="s" style="margin-top:4px;color:var(--muted)">prints ' + flags + '</div>' : '') +
    '</div></div>';
}
var TYPE_CHIPS = [["creature","Creatures & NPCs"],["hazard","Hazards"],["item","Items"],["spell","Spells"],["feat","Feats"],["own","Quick cards"]];
/* search, then the filters: type (All libraries), trait, level, docket only; then the sort */
function filtered(k){
  var F = filt(), list = cardsFor(k), q = ui.q.trim().toLowerCase();
  if(F.types.length) list = list.filter(function(c){ return F.types.indexOf(c.lib) >= 0; });
  if(q) list = list.filter(function(c){ return (c.name + " " + c.sub + " " + c.info + " " + c.traits.join(" ")).toLowerCase().indexOf(q) >= 0; });
  if(F.trait) list = list.filter(function(c){ return c.traits.some(function(t){ return t.toLowerCase() === F.trait.toLowerCase(); }); });
  if(F.lvl !== ""){ var r = F.lvl.split("-"); list = list.filter(function(c){ return c.lvl != null && c.lvl >= +r[0] && c.lvl <= +(r[1] == null ? r[0] : r[1]); }); }
  if(F.only) list = list.filter(function(c){ return k === "library" ? inDocket(c) : pickOf(k, c.ref); });
  var by = F.sort;
  list.sort(function(a, b){
    if(by === "level"){ var d = (a.lvl == null ? 99 : a.lvl) - (b.lvl == null ? 99 : b.lvl); if(d) return d; }
    if(by === "type"){ var e = a.lib.localeCompare(b.lib); if(e) return e; }
    return a.name.localeCompare(b.name);
  });
  return list;
}
function filterBar(k){
  var F = filt(), base = cardsFor(k), tr = {}, lv = {};
  base.forEach(function(c){ c.traits.forEach(function(t){ tr[t] = (tr[t] || 0) + 1; }); if(c.lvl != null) lv[c.lvl] = 1; });
  var traits = Object.keys(tr).sort(), levels = Object.keys(lv).map(Number).sort(function(a, b){ return a - b; });
  return '<div class="filters">' +
    (k === "library" ? '<div class="chipz">' + TYPE_CHIPS.map(function(t){ return '<button data-ft="' + t[0] + '" class="' + (F.types.indexOf(t[0]) >= 0 ? "on" : "") + '">' + t[1] + '</button>'; }).join("") + '</div>' : '') +
    (traits.length ? '<select id="ftrait" aria-label="Trait"><option value="">Any trait</option>' + traits.map(function(t){ return '<option' + (F.trait === t ? " selected" : "") + '>' + esc(t) + '</option>'; }).join("") + '</select>' : '') +
    (levels.length ? '<select id="flvl" aria-label="Level"><option value="">Any level</option>' + levels.map(function(l){ return '<option value="' + l + '"' + (F.lvl === String(l) ? " selected" : "") + '>Level ' + l + '</option>'; }).join("") +
      ['-1-2','3-6','7-10','11-14','15-20'].map(function(r){ return '<option value="' + r + '"' + (F.lvl === r ? " selected" : "") + '>Levels ' + r.replace(/^(-?\d+)-/, "$1–") + '</option>'; }).join("") + '</select>' : '') +
    '<select id="fsort" aria-label="Sort"><option value="name"' + (F.sort === "name" ? " selected" : "") + '>Sort: name</option><option value="level"' + (F.sort === "level" ? " selected" : "") + '>Sort: level</option>' + (k === "library" ? '<option value="type"' + (F.sort === "type" ? " selected" : "") + '>Sort: type</option>' : '') + '</select>' +
    '<label><input type="checkbox" id="fonly"' + (F.only ? " checked" : "") + '> In the docket only</label>' +
    ((F.trait || F.lvl || F.only || F.types.length || ui.q) ? '<button class="btn g s" id="fclear">Clear filters</button>' : '') +
    '</div>';
}
function renderTab(){
  var t = tab(ui.tab), k = t[0], lib = t[3], all = k === "library";
  var list = filtered(k), total = cardsFor(k).length;
  var inN = cardsFor(k).filter(function(c){ return all ? inDocket(c) : pickOf(k, c.ref); }).length;
  var adds = all ? '' : (lib ? '<a class="addcard" href="' + TOOLS[lib].page + '" target="_blank" rel="noopener">＋ New ' + t[4] + ' card<small>opens ' + TOOLS[lib].name + '; it appears here once saved</small></a>' : '') +
    '<button class="addcard" id="addc"' + (lib ? ' style="min-height:60px;font-size:.85rem"' : '') + '>＋ ' + (lib ? 'Quick card here' : 'Add ' + t[4] + ' card') + '</button>';
  var html = '<div class="libhead"><span style="font-size:1.4rem">' + t[2] + '</span><h2>' + t[1] + '</h2>' +
    '<input class="search" id="q" type="search" placeholder="Search names, traits…" value="' + esc(ui.q) + '">' +
    '<span class="cnt">' + (list.length < total ? list.length + " of " + total + " shown · " : total + " cards · ") + inN + (k === "pcs" ? " attending" : " in the docket") + '</span></div>' +
    filterBar(k);
  html += '<div class="grid">' + adds + list.map(function(c){ return cardTile(c, k); }).join("");
  if(!list.length) html += '<p class="muted" style="grid-column:1/-1">' + (total ? "Nothing matches the filters." : lib ? "No cards in " + TOOLS[lib].name + " yet. Make some there (they're saved on this device) and they'll show up here." : all ? "Your libraries are empty. Make cards in the card tools and they'll all show up here." : "") + '</p>';
  html += '</div>';
  $("lib").innerHTML = html;
  var F = filt(), re = function(){ renderTab(); };
  document.querySelectorAll("[data-ft]").forEach(function(b){ b.onclick = function(){ var i = F.types.indexOf(b.dataset.ft); if(i >= 0) F.types.splice(i, 1); else F.types.push(b.dataset.ft); re(); }; });
  if($("ftrait")) $("ftrait").onchange = function(){ F.trait = this.value; re(); };
  if($("flvl")) $("flvl").onchange = function(){ F.lvl = this.value; re(); };
  $("fsort").onchange = function(){ F.sort = this.value; re(); };

/* Demiplane, read directly (the same unofficial API the Initiative Cards import uses). */

  ["booklet","Booklet: cover, recap, intro, plan"],

  ["init","Initiative cards: creatures & NPCs"],

function toBytes(v){
  if(!v) return Promise.resolve(null);
  if(v.output) return Promise.resolve(v.output("arraybuffer"));
  if(v.arrayBuffer) return v.arrayBuffer();
  if(v instanceof ArrayBuffer) return Promise.resolve(v);
  return Promise.resolve(v);   /* {images:[…]} */
}
/* Builds the whole PDF. Resolves {bytes, base, problems} — or {parts} when pdf-lib couldn't load. */
var building = null, last = null, ver = 0;
function buildAll(){
  if(building) return building;
  var prog = $("prog"), s = cur(), v = ver;
  var on = function(k){ return partOn[k] !== false && partCount(k) > 0; };
  var jobs = [];
  if(on("booklet")) jobs.push(["Booklet", function(){ return Promise.resolve(buildBooklet()); }]);
  if(on("blocks")) jobs.push(["Stat blocks", function(){ return Promise.resolve(buildBlocks(blockList())); }]);
  if(on("init")) jobs.push(["Initiative cards", function(){ return fromTool("creature", libIds(["creatures","npcs"], "creature")); }]);
  if(on("hazard")) jobs.push(["Hazard cards", function(){ return fromTool("hazard", libIds(["hazards"], "hazard")); }]);
  if(on("item")) jobs.push(["Item cards", function(){ return fromTool("item", libIds(["items"], "item")); }]);
  if(on("spell")) jobs.push(["Spell cards", function(){ return fromTool("spell", libIds(["spells"], "spell")); }]);
  if(on("feat")) jobs.push(["Feat cards", function(){ return fromTool("feat", libIds(["feats"], "feat")); }]);
  if(on("quick")) jobs.push(["Quick cards & details", function(){ return buildQuick(quickList()); }]);
  if(!jobs.length) return Promise.reject(new Error("the docket is empty — pick some cards or write the booklet"));
  var parts = [], problems = [];
  var step = function(i){
    if(i >= jobs.length) return Promise.resolve();
    prog.textContent = "Making " + jobs[i][0].toLowerCase() + "… (" + (i + 1) + " of " + jobs.length + ")";
    return jobs[i][1]().then(toBytes).then(function(x){ if(x) parts.push({name:jobs[i][0], v:x}); },
      function(e){ console.error(jobs[i][0], e); problems.push(jobs[i][0] + ": " + (e && e.message || e)); }).then(function(){ return step(i + 1); });
  };
  var base = (s.title || "next-session").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").toLowerCase() || "next-session";
  $("pvbtn").disabled = $("pdf").disabled = true;
  building = loadJsPDF().then(function(){ return loadFonts().catch(function(e){ console.warn("fonts", e); fontData = null; }); })
    .then(function(){ return step(0); })
    .then(function(){
      if(!parts.length) throw new Error(problems.join("; ") || "nothing came out");
      prog.textContent = "Putting it together…";
      return loadPdfLib().then(function(){ return merge(parts); }).then(function(bytes){ return {bytes:bytes, base:base, problems:problems, ver:v}; },
        function(e){ console.warn("merge", e); problems.push("couldn't join the parts (pdf-lib didn't load)"); return {parts:parts, base:base, problems:problems, ver:v}; });
    })
    .then(function(r){ last = r; prog.textContent = r.problems.length ? "Problems: " + r.problems.join("; ") : ""; return r; })
    .then(function(r){ building = null; $("pvbtn").disabled = $("pdf").disabled = false; return r; },
          function(e){ building = null; $("pvbtn").disabled = $("pdf").disabled = false; prog.textContent = "Couldn't make the PDF: " + (e && e.message || e); throw e; });
  return building;
}
function fresh(){ return last && last.ver === ver ? Promise.resolve(last) : buildAll(); }
function savePdf(r){
  if(r.bytes) return TB.downloads.save({filename:r.base + ".pdf", data:new Blob([r.bytes], {type:"application/pdf"})}).then(function(){ toast("Saved " + r.base + ".pdf", 3000); });
  return r.parts.reduce(function(p, x, i){ return p.then(function(){
    if(x.v.images) return;
    return TB.downloads.save({filename:r.base + "-" + (i + 1) + "-" + x.name.toLowerCase().replace(/\W+/g, "-") + ".pdf", data:new Blob([x.v], {type:"application/pdf"})});
  }); }, Promise.resolve()).then(function(){ toast("Saved the parts as separate PDFs", 3500); });
}
var pvUrl = "";
function showPreview(r){
  var pv = $("pv"); if(pvUrl){ URL.revokeObjectURL(pvUrl); pvUrl = ""; }
  pv.classList.add("on");
  if(!r.bytes){ pv.innerHTML = '<div class="nopv">The parts couldn\'t be joined into one file here, so there\'s nothing to preview. Save PDF hands them over one by one.</div>'; return; }
  pvUrl = URL.createObjectURL(new Blob([r.bytes], {type:"application/pdf"}));
  var bar = '<div class="pvbar"><b>Preview</b><span class="muted" id="pvstale"></span><span class="sp"></span><a class="btn g s" href="' + pvUrl + '" target="_blank" rel="noopener">Open in a new tab</a><button class="btn g s" id="pvclose">Close preview</button></div>';
  /* phones (and some browsers) can't show a PDF inside a page: offer the file instead */
  if(navigator.pdfViewerEnabled === false) pv.innerHTML = bar + '<div class="nopv">This browser can\'t show a PDF inside the page. Use <b>Open in a new tab</b> to look through it, or <b>Save PDF</b>.</div>';
  else pv.innerHTML = bar + '<iframe title="Print preview" src="' + pvUrl + '#view=FitH"></iframe>';
  setTimeout(function(){ pv.scrollIntoView({behavior:"smooth", block:"start"}); }, 50);
  $("pvclose").onclick = function(){ pv.classList.remove("on"); pv.innerHTML = ""; if(pvUrl){ URL.revokeObjectURL(pvUrl); pvUrl = ""; } };
}
$("pvbtn").onclick = function(){ fresh().then(showPreview, function(){}); };
$("pdf").onclick = function(){ fresh().then(savePdf, function(){}); };
function merge(parts){
  var P = window.PDFLib;
  return P.PDFDocument.create().then(function(out){
    out.setTitle(sessLabel()); out.setCreator("Slappybag's Toolbag — Next Session");
    return parts.reduce(function(p, x){ return p.then(function(){
      if(!x.v.images){   /* bytes (an ArrayBuffer from a tool's frame isn't instanceof ours) */
        return P.PDFDocument.load(x.v).then(function(src){ return out.copyPages(src, src.getPageIndices()); }).then(function(pages){ pages.forEach(function(pg){ out.addPage(pg); }); });
      }
      return (x.v.images || []).reduce(function(q, im){ return q.then(function(){
        var bin = atob(im.data.split(",")[1]), arr = new Uint8Array(bin.length);
        for(var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return (/^data:image\/png/.test(im.data) ? out.embedPng(arr) : out.embedJpg(arr)).then(function(img){
          var pg = out.addPage([im.w * 72, im.h * 72]); pg.drawImage(img, {x:0, y:0, width:im.w * 72, height:im.h * 72});
        });
      }); }, Promise.resolve());
    }); }, Promise.resolve()).then(function(){ return out.save(); });
  });
}

/* ---------------- start ---------------- */
/* Cards made in another tab show up when you come back here. */
var reloadLibs = function(){ loadLibs().then(function(){ if(!$("page").classList.contains("on")) render(); }); };
window.addEventListener("focus", reloadLibs);
document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") reloadLibs(); });
Promise.all([TB.store.get(KEY).catch(function(){ return null; }), loadLibs()]).then(function(r){
  S = r[0] && Array.isArray(r[0].sessions) && r[0].sessions.length ? r[0] : migrate();
  S.own = S.own || []; S.extra = S.extra || {};
  if(!r[0]) TB.store.set(KEY, S).catch(function(){});
  render();
});
})();
